name: Baubap
description: >-
  Baubap is a Mexican fintech offering instant personal microloans through an
  Android mobile app. Founded in 2018 in Mexico City by Roberto Salcedo and Luis
  Villarreal, it grants loans from $500 to roughly $9,000 MXN in minutes with no
  credit-bureau check and no income verification, using its own AI/ML-based
  alternative-scoring model to serve underbanked and no-credit-history borrowers.
  On-time repayment unlocks progressively larger amounts and helps users build a
  positive credit history. Baubap operates as a regulated SOFOM registered with
  CONDUSEF and supervised by CNBV, complying with Mexican data-protection and
  financial-security regulations. It has no public developer API; this profile
  captures the company's identity, its published /llms.txt, and its
  domain-security posture.
